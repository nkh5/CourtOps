name: Release
on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy to the configured EC2 host after building
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: courtops-release
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml
  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - id: name
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "image=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.name.outputs.image }}:${{ github.sha }}
          build-args: VERSION=${{ github.sha }}
      - name: Record immutable release
        env:
          IMAGE: ${{ steps.name.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "Image to deploy — \`$IMAGE@$DIGEST\`" >> "$GITHUB_STEP_SUMMARY"
  
  deploy:
    if: inputs.deploy
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
          allowed-account-ids: "563384362525"

      - name: Deploy CourtOps through SSM
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          IMAGE: ${{ needs.publish.outputs.image }}@${{ needs.publish.outputs.digest }}
        run: |
          set -euo pipefail

          [[ "$IMAGE" =~ ^ghcr\.io/nkh5/courtops@sha256:[a-f0-9]{64}$ ]]

          PARAMETERS=$(jq -n --arg image "$IMAGE" \
            '{ImageDigest: [$image]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name CourtOps-Deploy \
            --parameters "$PARAMETERS" \
            --timeout-seconds 1200 \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM command: $COMMAND_ID"

          STATUS="Pending"

          for attempt in $(seq 1 90); do
            sleep 10

            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query Status \
              --output text 2>/dev/null) || continue

            echo "SSM status: $STATUS"

            case "$STATUS" in
              Success)
                break
                ;;
              Pending|InProgress|Delayed)
                ;;
              *)
                break
                ;;
            esac
          done

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Errors:StandardErrorContent}' \
            --output json

          [[ "$STATUS" == "Success" ]]

      - name: Verify public application
        env:
          HEALTH_URL: ${{ vars.COURTOPS_HEALTH_URL }}
        run: ./scripts/check-health.sh "$HEALTH_URL"
